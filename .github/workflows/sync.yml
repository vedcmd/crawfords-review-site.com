name: Weekly sync & rebuild

# Refreshes: product stock, price changes (monitored, not published),
# Trustpilot + Google ratings, and new posts from the Crawfords blog.
on:
  workflow_dispatch:        # the "sync now" button — Actions tab > Run workflow
  schedule:
    - cron: "0 6 * * 1"     # every Monday 06:00 UTC

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync live data (stock, prices, review platforms, blog)
        run: python3 sync.py

      - name: Rebuild site
        run: python3 build.py

      - name: Commit & push if anything changed
        run: |
          git config user.name "cmd-reviews-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes this week." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git commit -m "Weekly sync: $(date +%F)"
          git push
